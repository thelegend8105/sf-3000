id: net-tools-missing
description: Legacy networking tools (ifconfig/route) are not installed
applies_to:
  os: linux
  distros: [ubuntu]
symptoms:
  - "ifconfig: command not found"
  - "old network script won't run"
detect:
  command: "dpkg -s net-tools"
  produces: exit_code        # 0 if installed
expect:
  predicate: exit_zero       # healthy = package present
risk: safe
requires_privilege: true
reverse:
  strategy: command          # cleanly undoable: just remove the package again
  command:
    ubuntu: "apt-get -o DPkg::Lock::Timeout=60 remove -y net-tools"
    fedora: "dnf remove -y net-tools"
fix:
  ubuntu: "apt-get -o DPkg::Lock::Timeout=60 install -y net-tools"
  fedora: "dnf install -y net-tools"
verify:
  rerun: detect
source: "internal — demo playbook. detect + fix + verify proven on Ubuntu 26.04 LTS (resolute) 2026-09-05 and 2026-09-07, commit 2ef3c6d; outcome healed both times. The reverse command has never run. VM carried prior state, not a clean-baseline revert. DPkg::Lock::Timeout=60 was added to both the fix and the reverse on 2026-09-08; neither amended command has been re-run, and the reverse still has not run at all."
