# ORDERING: the journal vacuum runs FIRST on purpose. The two halves reclaim
# independently and neither needs the other, but `journalctl --vacuum-time`
# takes no apt lock while `apt-get clean` does. With the apt half first, lock
# contention from unattended-upgrades forfeited BOTH reclaims (observed on the
# VM 2026-09-07, exit 100). This way a blocked apt still leaves the journal
# space banked, while `&&` still propagates the real exit code so the run is
# reported honestly instead of masked by a succeeding second command.
#
# NO LOCK TIMEOUT: `-o DPkg::Lock::Timeout=60` was added here on 2026-09-08 and
# removed on 2026-09-09. The run that was meant to vet it held the archives lock
# for 90s against the 60s timeout; apt failed instantly, proving the option does
# not cover /var/cache/apt/archives/lock - the lock `apt-get clean` takes. Do not
# reinstate it here. The `blocked` outcome, not the timeout, is what makes lock
# contention honest for this playbook.
#
# The fedora key is currently unreachable - applies_to.distros is [ubuntu], so
# the engine refuses before pick_fix reads it. Left untouched rather than
# silently edited alongside a command nobody has vetted on Fedora.
id: disk-root-near-full
description: Root filesystem is critically low on free space
applies_to:
  os: linux
  distros: [ubuntu]
symptoms:
  - "computer very slow and warns about low disk space"
  - "update fails with no space left on device"
detect:
  command: "df --output=pcent / | tail -1 | tr -dc '0-9'"
  produces: integer          # percent of / used
expect:
  predicate: less_than
  value: 90                   # healthy = under 90% full
risk: moderate
requires_privilege: true
reverse:
  strategy: none             # only reclaims apt cache + old journals; nothing worth undoing
fix:
  ubuntu: "journalctl --vacuum-time=7d && apt-get clean"
  fedora: "dnf clean all && journalctl --vacuum-time=7d"
verify:
  rerun: detect
source: "internal - detect + fix + verify proven on Ubuntu 26.04 LTS (resolute). This command healed on 2026-09-09: 92% -> 86%. Two earlier versions also healed, both on 2026-09-08 (90% -> 85%): apt-get clean first, and journal first with DPkg::Lock::Timeout=60. Every heal was against a SYNTHETIC apt cache of downloaded kernels. Pushed to 95% it cannot get back under 90% and reports verify_failed (2026-09-08). A holder of /var/cache/apt/archives/lock stopped apt twice: unattended-upgrades on 2026-09-07, reported fix_failed by the engine of that day, and a deliberate holder on 2026-09-09, reported `blocked` - the journal half still ran first and freed 11M. Records: evidence/ubuntu-26.04-2026-09-10.jsonl. The reclaim is the apt cache plus journals older than 7d ONLY - it does not touch user data, so it will not rescue a disk filled by the user's own files. See the NO LOCK TIMEOUT note above."
