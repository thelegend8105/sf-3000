# BLAST RADIUS: `apt-get autoremove --purge` is NOT kernel-scoped. It removes
# every auto-installed package that is no longer required and purges its
# config. On a near-clean 26.04 VM this was kernels only - 15 packages,
# confirmed with `apt-get -s autoremove --purge` before the run - and Ubuntu's
# kernel autoremoval policy retained the running kernel AND one fallback. On a
# machine with more accumulated packages it will take more, and purged config
# is not "regenerable state". Run the -s simulation before trusting it there.
#
# Detect differs from the spreadsheet sketch (`df -P /boot`) on purpose: when
# /boot is NOT a separate mount, `df /boot` measures the ROOT filesystem, so a
# full root would fire this playbook and disk-root-near-full at once, and the
# kernel-removal fix would run for a problem it cannot solve. The findmnt guard
# reports healthy when there is no separate /boot, leaving root's fullness to
# the playbook that owns it.
id: boot-partition-full
description: The /boot partition is nearly full, so kernel and initramfs updates fail
applies_to:
  os: linux
  distros: [ubuntu]
symptoms:
  - "apt upgrade fails with no space left on device"
  - "kernel update won't install"
  - "update-initramfs: failed"
detect:
  command: "findmnt -no TARGET /boot | grep -qx /boot && df --output=pcent /boot | tail -1 | tr -dc '0-9' || echo 0"
  produces: integer          # percent of /boot used; 0 when /boot is not separate
expect:
  predicate: less_than
  value: 80                   # tighter than root: a kernel + initramfs needs ~150-300MB
risk: moderate
requires_privilege: true
reverse:
  strategy: none             # kernels come back from the archive; see BLAST RADIUS above
fix:
  ubuntu: "apt-get autoremove --purge -y"
verify:
  rerun: detect
source: "internal - detect + fix + verify proven on Ubuntu 26.04 LTS (resolute) 2026-09-07, commit 2ef3c6d: 100% -> 76%, outcome healed. /boot was 2.0G ext4 on /dev/sda2; the condition was INDUCED WITH A FILLER FILE because a 2G /boot does not fill naturally - the real-world case is a 512M /boot. Simulation proposed 15 packages, all kernel (7.0.0-14,15,22,27,28); running kernel -30 and fallback -29 retained. Blast radius on a machine with more auto-installed packages is NOT vetted."
