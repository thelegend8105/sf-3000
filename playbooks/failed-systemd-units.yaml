# BLAST RADIUS: the fix restarts EVERY failed service the detect lists, not
# only the one the user is asking about. The engine prints that list before
# asking y/N - read it before answering.
#
# SCOPE - deliberately narrower than "every failed unit":
#   * services only (not mounts, sockets, timers);
#   * loaded units only - a failed unit whose file was deleted is not a
#     broken service any more, and restarting it can only fail;
#   * Type=oneshot is EXCLUDED. Restarting a oneshot re-runs its job, and for
#     apt-daily-upgrade.service that job is installing upgrades. That is not
#     what someone agreeing to "restart failed services" agreed to.
# Detect and fix use the same filter, so the fix only ever restarts what the
# detect showed.
#
# THE WAIT is load-bearing: for Type=simple units `systemctl restart` exits 0
# as soon as the process is forked, even if it dies a moment later. On the VM
# (2026-10-06) a service that crashed ten seconds after its restart was caught
# only because verify waited 30s. Checked at once, it would have read healed.
#
# KNOWN LIMITS, not vetted away:
#   * a service that crashes MORE than 30s after starting reads as healed;
#   * a service that crash-loops slowly enough never shows as failed at all,
#     before or after the fix - this playbook cannot see it;
#   * if one of several restarts fails, systemctl exits non-zero and the
#     outcome is fix_failed, even if the others recovered.
#
# HISTORY: until 2026-10-02 the fix was `systemctl reset-failed`, which clears
# the failed flag - the very thing the detect counts - so the engine could
# report healed on a still-broken machine. The entry left the library for
# candidates/ until this restart fix was proven on a VM, which happened on
# 2026-10-06 (DESIGN.md section 16).
#
# Test units for the VM run are in tests/systemd-proof/.
id: failed-systemd-units
description: One or more systemd services have stopped with an error
applies_to:
  os: linux
  distros: [ubuntu]
symptoms:
  - "something isn't starting on boot"
  - "a service keeps dying"
detect:
  command: |-
    systemctl --failed --type=service --no-legend --plain |
      awk '$2 == "loaded" {print $1}' |
      while read -r u; do
        [ "$(systemctl show -p Type --value "$u")" = oneshot ] || echo "$u"
      done
  produces: line_count       # one line per failed, loaded, non-oneshot service
expect:
  predicate: equals
  value: 0
risk: moderate               # starting a service runs whatever it does on start
requires_privilege: true     # restarting system units goes through polkit
reverse:
  strategy: none             # the services were already down; there is no "un-restart"
fix:
  ubuntu: |-
    systemctl --failed --type=service --no-legend --plain |
      awk '$2 == "loaded" {print $1}' |
      while read -r u; do
        [ "$(systemctl show -p Type --value "$u")" = oneshot ] || echo "$u"
      done |
      xargs -r systemctl restart
verify:
  rerun: detect
  settle_seconds: 30
source: "internal - detect + fix + verify proven on Ubuntu 26.04 LTS (resolute) 2026-10-06, commit 10cb1fd, against three throwaway services from tests/systemd-proof/ - not a real service failure. A service whose cause had been removed was restarted and stayed up: healed, 1 -> 0 after the 30s wait. A service that crashed 10s after its restart was caught by the wait: verify_failed, 1 -> 1, and reverse none logged 'nothing to undo'. Checked at once, it would have read healed. A failed oneshot was present for both runs and was neither counted nor restarted (the VM journal shows one start only). Records: evidence/ubuntu-26.04-2026-10-06.jsonl. Replaces `systemctl reset-failed`, removed 2026-10-02 because it cleared the flag the detect counts; that fix's old claim of a 24.04 test left no record and was not carried over."
