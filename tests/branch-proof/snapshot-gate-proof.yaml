# NOT A REAL PLAYBOOK. Proves the snapshot gate refuses a destructive fix.
#
# risk: destructive (and reverse: snapshot_only) means the engine must refuse
# before it runs anything at all - detect included - because the snapshot
# layer is not built. The fix would leave a marker file; after the run that
# file must NOT exist.
#
# Expected: "requires a snapshot before fixing ... Refusing to fix.", exit 4,
# and `ls /tmp/sf3000-snapshot-gate-breach` reports "No such file".
# The refusal comes before logging, so no run record is written.
#
# Lives in tests/, NOT playbooks/, so it never loads in a normal run.
id: snapshot-gate-proof
description: Destructive fix that the snapshot gate must refuse
applies_to:
  os: linux
  distros: [ubuntu]
symptoms:
  - "not a real symptom - test fixture only"
detect:
  command: "false"
  produces: exit_code
expect:
  predicate: exit_zero
risk: destructive
requires_privilege: false
reverse:
  strategy: snapshot_only
fix:
  ubuntu: "touch /tmp/sf3000-snapshot-gate-breach"   # must never run
verify:
  rerun: detect
source: "internal - test fixture, not a vetted repair. Run on Ubuntu 26.04 LTS (resolute) 2026-10-04, commit 69658de: refused with exit 4, and the marker file was never created. No log record by design; the result is the terminal output, confirmed by the person who ran it."
