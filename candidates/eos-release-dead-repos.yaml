# CANDIDATE - not yet vetted. The project's origin story: the lab ran 22.10.
#
# The spreadsheet sketch detects with "lsb_release -sc + EOL check + apt-get
# update result". `apt-get update` writes to /var/lib/apt/lists, so it is a
# mutation and cannot be the detect - the sheet's own golden rule #1. This
# detect changes nothing on the machine. It reports a problem only when ALL
# of these hold:
#   1. the release is past its EOL date (distro-info-data, already on disk);
#   2. apt's active lines (not comments) still point at
#      archive/security.ubuntu.com;
#   3. archive.ubuntu.com no longer serves this release (HTTP 404) AND
#      old-releases.ubuntu.com does (HTTP 200).
#
# WHY (3) EXISTS - corrected 2026-10-02. The EOL date alone is not "the repos
# are dead". Checked against the live servers that day: 20.04 (EOL
# 2025-05-29) is still on the main archive because LTS releases stay there
# through ESM; 25.04 and 25.10 were past EOL but not moved yet. On every one
# of those the old detect fired, and the fix would have pointed apt at
# old-releases, which does not carry them - breaking a working apt. A fix
# that causes the problem it names is the worst kind of library entry.
# Asking the two servers is a read, not a change to this machine.
#
# Also corrected 2026-10-02: the detect used `grep -r` over sources.list.d/,
# which also read the fix's own *.sf3000.bak copies (and the installer's
# *.curtin.orig), still full of the old URLs. Verify could never pass. It
# now reads only *.list and *.sources - the files apt itself reads - and
# matches exactly the URLs the fix's sed rewrites, so detect and fix agree.
#
# ERROR, not healthy, when it cannot tell: a missing distro-info file or
# unreachable servers print nothing, which the engine reports as ERROR.
#
# KNOWN LIMIT: verify proves the sources were rewritten, not that `apt-get
# update` now succeeds. Proving that requires a mutation, so it stays a manual
# check after the run.
#
# Corrected 2026-10-07, after the 22.10 VM run: the count included
# commented-out lines. That install has 10 `deb` lines, each with a
# `# deb-src` twin, and the detect found 20. It still healed, because the fix
# rewrites both. But on a machine whose active lines were already fixed by
# hand, old addresses left only in comments read as a problem. The detect now
# drops everything from `#` to the end of each line before counting, the way
# apt reads a one-line sources.list. The fix still rewrites comments too, so a
# `deb-src` line uncommented later points at old-releases as well.
id: eos-release-dead-repos
description: This Ubuntu release is end-of-support, its packages have moved to old-releases, and apt still points at the old address
symptoms:
  - "apt update says 404 not found"
  - "repository does not have a Release file"
  - "my Ubuntu is old and updates are broken"
applies_to:
  os: linux
  distros: [ubuntu]
detect:
  command: |-
    . /etc/os-release
    csv=/usr/share/distro-info/ubuntu.csv
    [ -r "$csv" ] || { echo "cannot read $csv" >&2; exit 1; }
    awk -F, -v s="$VERSION_CODENAME" -v today="$(date +%F)" '$3 == s && $6 != "" && $6 < today { e = 1 } END { exit e ? 0 : 1 }' "$csv" || { echo 0; exit 0; }
    n=$(sed 's/#.*//' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null | grep -oE 'https?://([a-z0-9.-]*archive|security)\.ubuntu\.com/ubuntu' | wc -l)
    [ "$n" -eq 0 ] && { echo 0; exit 0; }
    python3 - "$VERSION_CODENAME" <<'PY'
    import sys, urllib.error, urllib.request
    def status(url):
        try:
            req = urllib.request.Request(url, method="HEAD")
            with urllib.request.urlopen(req, timeout=8) as resp:
                return resp.status
        except urllib.error.HTTPError as err:
            return err.code
        except Exception:
            return None
    series = sys.argv[1]
    live = status(f"http://archive.ubuntu.com/ubuntu/dists/{series}/Release")
    old = status(f"http://old-releases.ubuntu.com/ubuntu/dists/{series}/Release")
    if live is None or old is None:
        sys.exit("could not reach the Ubuntu archives")   # exit 1
    sys.exit(0 if (live == 404 and old == 200) else 3)
    PY
    rc=$?
    [ "$rc" -eq 0 ] && { echo "$n"; exit 0; }
    [ "$rc" -eq 3 ] && { echo 0; exit 0; }
    exit 1
  produces: integer          # dead-archive URLs on apt's active lines; 0 when there is nothing to fix
expect:
  predicate: equals
  value: 0
risk: moderate
requires_privilege: true
reverse:
  strategy: command          # every edited file is backed up first, so the undo is real
  command:
    ubuntu: |-
      for b in /etc/apt/sources.list.sf3000.bak /etc/apt/sources.list.d/*.sf3000.bak; do
        [ -e "$b" ] || continue
        mv -f "$b" "${b%.sf3000.bak}"
      done
fix:
  ubuntu: |-
    for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
      [ -e "$f" ] || continue
      cp -n "$f" "$f.sf3000.bak"
      sed -i -E -e 's|https?://[a-z0-9.-]*archive\.ubuntu\.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' -e 's|https?://security\.ubuntu\.com/ubuntu|http://old-releases.ubuntu.com/ubuntu|g' "$f"
    done
verify:
  rerun: detect
source: "CANDIDATE - NOT VETTED. Sketch from the tracker (Ubuntu sheet, eos-release-dead-repos). Detect reworked 2026-10-02 (server check; no longer reads backup files). Healed twice on Ubuntu 22.10 (kinetic) on 2026-10-07, with the reverse command run by hand in between (tests/eos-proof/, evidence/ubuntu-22.10-2026-10-07.jsonl). The detect changed again that day to skip commented-out lines; that version has not run on a VM. Still owed: 22.10 again (expect 10, not 20); 24.10 must heal; 20.04 and 25.04 must report healthy."
