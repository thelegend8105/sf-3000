# CANDIDATE - not yet vetted. Visit 3 of the lab's upgrade: Ubuntu 23.10 to
# 24.04 LTS, in place. One procedure per upgrade, one upgrade per visit, each
# run with the person there; README.md here has the order and why each part
# is the way it is.
#
#   sudo python3 engine/runner.py --procedures candidates/procedures \
#        --run release-upgrade-to-24.04 --take-snapshot
#
# From 23.10 the next supported release is 24.04, so this is an ordinary
# do-release-upgrade. Its upgrader replaces old-releases addresses with the
# main archive, so apt moves back there by itself (seen on the 22.10 VM in
# visit 3). 24.04 is supported until 2029: a good place to pause.
id: release-upgrade-to-24.04
description: Upgrade an end-of-life Ubuntu 23.10 machine in place to 24.04 LTS, the next release (visit 3 of 4)
symptoms:
  - "my Ubuntu is too old"
  - "upgrade to the latest Ubuntu"
  - "this Ubuntu release is no longer supported"
applies_to:
  os: linux
  distros: [ubuntu]
risk: destructive           # an upgrade cannot be undone, and can stop a machine booting
requires_privilege: true
reverse:
  strategy: snapshot_only   # the way back is a snapshot: --take-snapshot, or one you name
steps:
  - id: to-24.04
    description: 23.10 to 24.04 LTS (do-release-upgrade; apt moves back to the main archive)
    requires:
      detect:
        command: '. /etc/os-release && echo "$VERSION_CODENAME"'
        produces: string
      expect:
        predicate: equals
        value: mantic
    detect:
      command: |-
        . /etc/os-release
        if [ -n "$(dpkg --audit 2>&1)" ]; then echo 0; else echo "$VERSION_ID" | tr -d .; fi
      produces: integer
    expect:
      predicate: greater_than
      value: 2403
    run:
      ubuntu: |-
        set -e
        export DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 RELEASE_UPGRADER_NO_SCREEN=1
        apt-get update
        apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold full-upgrade
        do-release-upgrade -f DistUpgradeViewNonInteractive
    timeout_minutes: 360
    reboot_after: true
source: "CANDIDATE - NOT VETTED. Written 2026-10-07 from the upgraders' source (update-manager, ubuntu-release-upgrader: branches kinetic, lunar, mantic, noble) and changelogs.ubuntu.com/meta-release, checked that day. Split on 2026-10-08 into one procedure per upgrade, so each lab visit runs one with the person there. Healed once on the 22.10 VM (KineticServer, a BIOS server) on 2026-10-10, with --take-snapshot, straight after visit 2 and with no restore between: 23.10 to 24.04 in 27 minutes, apt moved from old-releases to gb.archive.ubuntu.com (evidence/ubuntu-22.10-2026-10-10-4.jsonl). Not yet run on a UEFI desktop."
